    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

", "name": "_"}], "metadata": {"marimo_version": "0.25.2"}, "version": "1"},
            "session": {"cells": [{"code_hash": "2cab78099bd636427406100deebd3495", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "9b165af562983bd9f3ff0338a6845b5a", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "950ab0254c9de140014c864e9dc1de1c", "console": [], "id": "vblA", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "a257d83f9f52a283994bade07cd1605c", "console": [], "id": "bkHC", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"week-3-neural-networks-vision-and-attention\"\u003EWeek 3: Neural networks, vision and attention\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003EA full week of self-study, mapped to \u003Cstrong\u003EDeep Learning and Neural Networks\u003C/strong\u003E. Estimated \u003Cstrong\u003E16 active hours\u003C/strong\u003E, not an official contact-hour claim.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EIndependent reconstruction, not NUS-issued teaching material.\u003C/strong\u003E Published objectives are the anchor. Exercises, datasets and rubric are original.\u003C/span\u003E\n\u003Cul\u003E\n\u003Cli\u003ETrain a small network with backpropagation\u003C/li\u003E\n\u003Cli\u003EInspect convolution and recurrent state updates\u003C/li\u003E\n\u003Cli\u003EExplain attention weights and distinguish a toy from a pretrained Transformer\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Ca href=\"https://www.comp.nus.edu.sg/executive-education/course/sctp-deep-learning-and-neural-networks/\" rel=\"noopener noreferrer\" target=\"_blank\"\u003EOfficial objectives\u003C/a\u003E | \u003Ca href=\"https://github.com/azjhf-dev/nus-aie-week-03-deep-learning\" rel=\"noopener noreferrer\" target=\"_blank\"\u003ERepository\u003C/a\u003E\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EBoundary:\u003C/strong\u003E The browser core teaches mechanisms; build_lab.py actually trains small CNN, RNN and Transformer models on synthetic tasks. Pretrained models, natural-language/image benchmarks and full-scale training are not bundled.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "18fd3b0ebf071806f917da29af0e90d5", "console": [], "id": "lEQa", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"plan-your-week\"\u003EPlan your week\u003C/h2\u003E\n\u003Cul\u003E\n\u003Cli\u003EDay 1: tensors, activations and gradients (3h)\u003C/li\u003E\n\u003Cli\u003EDay 2: MLP training and failure modes (3h)\u003C/li\u003E\n\u003Cli\u003EDay 3: convolution and transfer learning (3h)\u003C/li\u003E\n\u003Cli\u003EDay 4: RNN state and attention (3h)\u003C/li\u003E\n\u003Cli\u003EDay 5: model comparison and report (4h)\u003C/li\u003E\n\u003C/ul\u003E\n\u003Cspan class=\"paragraph\"\u003EStart each lab by predicting the effect of a control. Change one variable, record the observation, then explain why. All default experiments need no key, no paid service and no private data. The hosted WASM viewer needs an internet connection to fetch its runtime and packages.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "e7dcf544d6e13bfb4f59f9c13e86467e", "console": [], "id": "PKri", "outputs": [{"data": {"text/html": "\u003Cmarimo-ui-element object-id='PKri-0' random-id='e1eaf78d-16b4-dbb0-930a-7d7e68bcbe5c'\u003E\u003Cmarimo-checkbox data-initial-value='true' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003ePlay conceptual motion graphic\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-disabled='false'\u003E\u003C/marimo-checkbox\u0 , "console": [], "id": "SFPL", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"01-train-a-nonlinear-network\"\u003E01 | Train a nonlinear network\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EA two-layer tanh network is trained with binary cross-entropy and hand-written backpropagation on XOR. This tiny task reveals nonlinear representation learning. Four points are not evidence of generalisation.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "9afe3d175ad78fd6f021662581b03cea", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.5rem'\u003E\u003Cmarimo-ui-element object-id='BYtC-0' random-id='9aedf264-acb5-488b-a23b-23c2135ea455'\u003E\u003Cmarimo-slider data-initial-value='1000' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eTraining epochs\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-start='100' data-stop='2500' data-step='100' data-steps='[]' data-debounce='false' data-disabled='false' data-orientation='\u0026quot;horizontal\u0026quot;' data-show-value='false' data-include-input='false' data-full-width='false'\u003E\u003C/marimo-slider\u003E\u003C/marimo-ui-element\u003E\u003Cmarimo-ui-element object-id='BYtC-1' random-id='a62b8ef3-20c4-0d8f-9e8f-a0e8ae968f26'\u003E\u003Cmarimo-slider data-initial-value='4' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eHidden units\u0026#92;u003c/span\u0026#92;u00 u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eWhy divide QK transpose by square root of key dimension?\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;,\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eBuild task\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;]' data-multiple='false' data-expanded='[]'\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe XOR network trains both layers with backpropagation. Fixed convolution, scalar recurrence and seeded attention are mechanism demonstrations.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIt controls score scale as dimensionality increases, reducing extreme softmax saturation.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003Cdiv\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EImplement a framework CNN on a small public image dataset, compare with a non-neural baseline, and log seeds, curves and errors. Do not call the fixed filter a trained CNN.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/marimo-accordion\u003E"}, "type": "data"}]}, {"code_hash": "b4d598fed5e6af2fac40e8f26dd7d57b", "console": [], "id": "ulZA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"evidence-and-next-depth\"\u003EEvidence and next depth\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThese are \u003Cs
